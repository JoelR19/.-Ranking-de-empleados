<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Ventas - Empleados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🏆 Ranking de Ventas</h1>
        <p class="subtitle">Top Vendedores del Mes</p>
    </header>
    <main class="container">

        <div class="ranking-container">
            <div class="employee top-performer">
                <div class="position">1</div>
                <div class="employee-info">
                    <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="Empleado 1" class="avatar">
                    <div class="details">
                        <h3>Carlos Rodríguez</h3>
                        <p class="sales">Ventas: $125,000</p>
                    </div>
                </div>
                <p class="medal">🥇</p>
            </div>

            <div class="employee top-performer">
                <div class="position">2</div>
                <div class="employee-info">
                    <img src="https://randomuser.me/api/portraits/women/1.jpg" alt="Empleado 2" class="avatar">
                    <div class="details">
                        <h3>Ana Martínez</h3>
                        <p class="sales">Ventas: $98,500</p>
                    </div>
                </div>
                <p class="medal">🥈</p>
            </div>

            <div class="employee">
                <div class="position">3</div>
                <div class="employee-info">
                    <img src="https://randomuser.me/api/portraits/men/2.jpg" alt="Empleado 3" class="avatar">
                    <div class="details">
                        <h3>Luis García</h3>
                        <p class="sales">Ventas: $87,200</p>
                    </div>
                </div>
            </div>

            <div class="employee">
                <div class="position">4</div>
                <div class="employee-info">
                    <img src="https://randomuser.me/api/portraits/women/2.jpg" alt="Empleado 4" class="avatar">
                    <div class="details">
                        <h3>María López</h3>
                        <p class="sales">Ventas: $76,800</p>
                    </div>
                </div>
            </div>

            <div class="employee">
                <div class="position">5</div>
                <div class="employee-info">
                    <img src="https://randomuser.me/api/portraits/men/3.jpg" alt="Empleado 5" class="avatar">
                    <div class="details">
                        <h3>Pedro Sánchez</h3>
                        <p class="sales">Ventas: $65,300</p>
                    </div>
                </div>
            </div>
        </div>


        <div class="addEmployee ">
            <form action="">
                <img src="" alt="">
                <input type="text" placeholder="Nombre">
                <input type="text" placeholder="Apellido">
                <input type="number" placeholder="Ventas">
                <button type="submit">Agregar Empleado</button>
            </form>

        </div>
    </main>
</body>
</html>
